[project]
name = "psycho-music"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "R. Kyle Norris", email = "r.kyle.norris@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "loguru>=0.8.0",
